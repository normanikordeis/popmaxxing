<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ava Max — POPMAXXiNG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Geist:wght@300;400;600&family=Geist+Mono:wght@300;400&family=Playfair+Display:ital,wght@0,400;0,900;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #d4af37;
      --royal-gold: #c5a028;
      --deep-crimson: #4a0404;
      --parchment: #fdfaf0;
      --ink: #1a1612;
      --glass-bg: rgba(26, 22, 18, 0.85);
      --radius: 20px;
    }

    body {
      font-family: 'Geist', sans-serif;
      background: #0a0908;
      color: var(--parchment);
      min-height: 100dvh;
      overflow-x: hidden;
      position: relative;
    }

    /* Grain & Texture Overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 200;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ── macOS Menubar (Medieval Edition) ──────────────── */
    .mac-menubar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 44px;
      background: rgba(10, 9, 8, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
      font-size: 13px;
      font-weight: 500;
      color: var(--gold);
    }
    .menu-items { display: flex; gap: 20px; font-family: 'Cinzel', serif; }
    .clock { font-family: 'Geist Mono', monospace; font-size: 12px; }

    /* ── Royal Background ───────────────────────── */
    .wallpaper {
      position: fixed; inset: 0;
      z-index: 0;
      background: radial-gradient(circle at center, #2a0202 0%, #0a0908 100%);
    }
    .wp-img {
      position: absolute; inset: 0;
      opacity: 0.35;
      background: url('https://images.unsplash.com/photo-1599718712282-3786f0d7e481?auto=format&fit=crop&q=80&w=2000') center/cover no-repeat;
      filter: grayscale(0.5) sepia(0.2) contrast(1.1);
    }

    /* ── Main Window ─────────────────────────── */
    .page {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center;
      padding-top: 80px;
      padding-bottom: 120px;
    }

    .mac-window {
      width: min(900px, calc(100vw - 40px));
      background: var(--glass-bg);
      border-radius: var(--radius);
      border: 1px solid rgba(212, 175, 55, 0.3);
      box-shadow: 0 50px 100px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    .titlebar {
      height: 40px;
      background: rgba(212, 175, 55, 0.1);
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      display: flex; align-items: center;
      padding: 0 15px;
      position: relative;
    }
    .tls { display: flex; gap: 8px; }
    .tl { width: 12px; height: 12px; border-radius: 50%; background: var(--gold); opacity: 0.5; }
    .tb-title {
      position: absolute; left: 50%; transform: translateX(-50%);
      font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 2px;
    }

    /* ── Content ─────────────────────────── */
    .win-body { padding: 50px; }

    .header { text-align: center; margin-bottom: 60px; }
    .artist-name {
      font-family: 'Cinzel', serif;
      font-size: 14px; letter-spacing: 6px;
      color: var(--gold); text-transform: uppercase; margin-bottom: 10px;
    }
    .album-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(50px, 8vw, 90px);
      font-weight: 900; line-height: 0.9;
      background: linear-gradient(to bottom, #fff, var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }

    /* ── The Tracklist Reveal ────────────────── */
    .reveal-section {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(212, 175, 55, 0.1);
      border-radius: 15px;
      padding: 40px;
    }
    .reveal-header {
      text-align: center; font-family: 'Cinzel', serif;
      font-size: 12px; color: var(--gold); margin-bottom: 30px;
      letter-spacing: 3px;
    }

    .track-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .track-item {
      position: relative;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      display: flex; align-items: center;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .track-item:hover {
      background: rgba(212, 175, 55, 0.08);
      border-color: var(--gold);
    }

    .track-number {
      font-family: 'Geist Mono', monospace;
      color: var(--gold); font-size: 12px; margin-right: 25px;
      width: 20px;
    }

    .track-name {
      font-family: 'Playfair Display', serif;
      font-size: 22px; font-weight: 600;
      letter-spacing: 1px;
      filter: blur(8px);
      opacity: 0.2;
      transition: all 0.6s ease;
      user-select: none;
    }

    .track-item.revealed .track-name {
      filter: blur(0);
      opacity: 1;
    }

    .seal-btn {
      margin-left: auto;
      width: 34px; height: 34px;
      background: #7a0b0b;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,0,0,0.3);
      font-family: 'Cinzel', serif; font-size: 14px; font-weight: 900;
      color: var(--gold);
      transition: transform 0.3s;
    }
    .track-item.revealed .seal-btn {
      transform: scale(0.8) rotate(20deg);
      background: var(--gold); color: #7a0b0b;
      box-shadow: 0 0 15px var(--gold);
    }

    /* ── Recent Albums Dock ────────────────── */
    .dock {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; padding: 12px;
      background: rgba(10, 9, 8, 0.6);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 24px;
      z-index: 1000;
    }
    .dock-item {
      width: 50px; height: 50px; border-radius: 12px; overflow: hidden;
      cursor: pointer; border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.2s;
    }
    .dock-item:hover { transform: translateY(-10px) scale(1.2); }
    .dock-item img { width: 100%; height: 100%; object-fit: cover; }

    @media (max-width: 600px) {
      .win-body { padding: 25px; }
      .album-title { font-size: 45px; }
      .track-name { font-size: 18px; }
    }
  </style>
</head>
<body>

<header class="mac-menubar">
  <div style="display:flex;align-items:center;gap:15px">
    <span style="font-size:18px">⚔️</span>
    <nav class="menu-items">
      <span style="font-weight:700">POPMAXXiNG</span>
      <span>Kingdom</span>
      <span>Archive</span>
    </nav>
  </div>
  <div class="clock" id="menuClock">12:00 PM</div>
</header>

<div class="wallpaper">
  <div class="wp-img"></div>
</div>

<div class="page">
  <main class="mac-window">
    <div class="titlebar">
      <div class="tls">
        <div class="tl"></div>
        <div class="tl"></div>
        <div class="tl"></div>
      </div>
      <div class="tb-title">Ava Max — Royal_Decict.app</div>
    </div>

    <div class="win-body">
      <div class="header">
        <p class="artist-name">Ava Max</p>
        <h1 class="album-title">POPMAXXiNG</h1>
        <p style="font-family: 'Geist Mono'; font-size: 10px; letter-spacing: 3px; color: var(--gold); opacity: 0.7;">
          SUMMER MMXXVI — THE REIGN BEGINS
        </p>
      </div>

      <div class="reveal-section">
        <p class="reveal-header">Break the wax seals to reveal the tracklist</p>
        <div class="track-grid" id="trackGrid">
          </div>
      </div>
    </div>
  </main>
</div>

<nav class="dock">
  <div class="dock-item" title="Heaven & Hell"><img src="https://m.media-amazon.com/images/I/815y0BCHH0L._SL1500_.jpg" alt="H&H"/></div>
  <div class="dock-item" title="Diamonds & Dancefloors"><img src="https://m.media-amazon.com/images/I/813tNidXj5L._SL1500_.jpg" alt="D&D"/></div>
  <div class="dock-item" title="I Am"><img src="https://upload.wikimedia.org/wikipedia/en/2/2f/Ava_Max_-_I_Am.png" alt="I Am"/></div>
  <div style="width:1px; background:rgba(212,175,55,0.3); margin: 0 5px;"></div>
  <div class="dock-item" title="Instagram" onclick="window.open('https://instagram.com/avamax')">
    <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" style="filter: invert(1) sepia(1) saturate(5) hue-rotate(0deg);" />
  </div>
</nav>

<script>
  const tracks = [
    "KiLL iT QUEEN", "WHY AREN'T YOU DEAD", "OUT OF YOUR MIND",
    "BEFORE YOU KNOW IT", "KNOW MY NAME", "BLOCKBUSTER",
    "PLATONIC", "TWO FREAKS IN LOVE", "ENERGY", "WORK", "ONE NiGHT"
  ];

  const grid = document.getElementById('trackGrid');

  tracks.forEach((track, i) => {
    const item = document.createElement('div');
    item.className = 'track-item';
    item.innerHTML = `
      <span class="track-number">${(i+1).toString().padStart(2, '0')}</span>
      <span class="track-name">${track}</span>
      <div class="seal-btn">M</div>
    `;
    item.onclick = () => item.classList.add('revealed');
    grid.appendChild(item);
  });

  function updateClock() {
    const n = new Date();
    document.getElementById('menuClock').textContent = n.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  }
  setInterval(updateClock, 1000);
  updateClock();
</script>

</body>
</html>
